
<!DOCTYPE html>
<html>
<head>
    <title>Review Carousel</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Our Reviews</h1>

        <div class="review-box">

            <h2 id="name">John</h2>

            <h4 id="job">Web Developer</h4>

            <p id="review">
                This website is amazing!
            </p>

            <div class="buttons">

                <button id="prev">Previous</button>

                <button id="next">Next</button>

            </div>

            <button id="random">Surprise Me</button>

        </div>

    </div>

    <!-- Connect JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
